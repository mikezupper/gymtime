name: Question
description: Ask about setup, operation, or contributing.
labels: [question]
body:
  - type: markdown
    attributes:
      value: Check the README and docs first. Keep credentials, real calendar links, sign-in details, and private data out of your question.
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Explain your goal and what you have tried.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Include the commit, native or Docker setup, and browser if relevant.
