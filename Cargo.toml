[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
license = "MIT"
repository = "https://github.com/mikezupper/gymtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
gymtime-domain = { path = "crates/domain", version = "=0.1.0" }
gymtime-app = { path = "crates/app", version = "=0.1.0" }
gymtime-infra = { path = "crates/infra", version = "=0.1.0" }
gymtime-api = { path = "crates/api", version = "=0.1.0" }
thiserror = "=2.0.21"
async-trait = "0.1.91"
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-util = "0.7.19"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
utoipa = { version = "=6.0.0", features = ["axum_extras"] }
resend-rs = { version = "=0.33.0", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "catch-panic", "set-header", "timeout"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
secrecy = "0.10.3"
proptest = "=1.11.0"
tempfile = "3.27.0"
hmac = "=0.12.1"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
ipnet = "=2.12.2"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
float_arithmetic = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
