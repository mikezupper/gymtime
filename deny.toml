[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
[licenses]
version = 2
private = { ignore = true }
allow = ["CDLA-Permissive-2.0", "0BSD", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "OpenSSL", "MPL-2.0"]
[bans]
multiple-versions = "warn"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
